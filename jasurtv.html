
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>📺 JasurTV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden}
#player-wrap{position:relative;width:100%;height:100vh;background:#000}
video{width:100%;height:100%;object-fit:contain}

#watermark{
  position:absolute;top:14px;right:14px;
  display:flex;align-items:center;gap:6px;
  pointer-events:none;z-index:10;
}
#wtxt{
  font-size:18px;font-weight:900;
  background:linear-gradient(135deg,#e50914,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1px;
  animation:wmark 12s infinite;
}
#wdot{width:8px;height:8px;border-radius:50%;background:#e50914;animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes wmark{
  0%,8%{opacity:1;font-size:18px;letter-spacing:1px}
  10%,35%{opacity:.7;font-size:13px;letter-spacing:3px}
  37%,100%{opacity:1;font-size:18px;letter-spacing:1px}
}

#bottom-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  padding:32px 16px 16px;pointer-events:none;
}
#show-title{font-size:15px;font-weight:600;color:#fff;opacity:.9;}
#show-type{font-size:12px;color:#aaa;margin-top:2px;}

#live-badge{
  position:absolute;top:14px;left:14px;
  background:#e50914;color:#fff;
  font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:4px;letter-spacing:1px;
  animation:blink 2s ease-in-out infinite;
}

/* Loading */
#loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#000;z-index:20;
}
#loading-logo{
  font-size:48px;font-weight:900;
  background:linear-gradient(135deg,#e50914,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:16px;letter-spacing:2px;
}
#loading-spin{
  width:40px;height:40px;
  border:3px solid #333;border-top-color:#e50914;
  border-radius:50%;animation:spin 1s linear infinite;
  margin-bottom:12px;
}
#loading-txt{font-size:13px;color:#888}
@keyframes spin{to{transform:rotate(360deg)}}

/* Retry button */
#retry-btn{
  margin-top:16px;background:#e50914;color:#fff;
  border:none;padding:10px 24px;border-radius:8px;
  font-size:14px;cursor:pointer;display:none;
}

/* No signal */
#nosignal{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0a0a0a;z-index:15;
}
#nosignal h2{font-size:22px;margin-bottom:8px}
#nosignal p{color:#888;font-size:14px;text-align:center;padding:0 32px}
#next-info{
  margin-top:20px;background:#111;border-radius:12px;
  padding:14px 20px;text-align:center;max-width:280px;
}
#next-info h3{font-size:14px;color:#e50914;margin-bottom:6px}
#next-info p{font-size:15px;font-weight:600}

#viewers{
  position:absolute;top:14px;left:70px;
  background:rgba(0,0,0,.6);border-radius:20px;
  padding:4px 10px;font-size:12px;color:#ccc;
  display:flex;align-items:center;gap:5px;
}
</style>
</head>
<body>
<div id="player-wrap">
  <div id="loading">
    <div id="loading-logo">JasurTV</div>
    <div id="loading-spin"></div>
    <div id="loading-txt">Yuklanmoqda...</div>
    <button id="retry-btn" onclick="retryInit()">🔄 Qayta urinish</button>
  </div>
  <div id="nosignal">
    <div style="font-size:48px">📺</div>
    <h2>Hozir efir yo'q</h2>
    <p>Tez orada yangi efir boshlanadi</p>
    <div id="next-info" style="display:none">
      <h3>⏰ Keyingi efir</h3>
      <p id="next-title"></p>
      <p id="next-time" style="color:#e50914;font-size:13px;margin-top:4px"></p>
    </div>
  </div>
  <video id="vid" playsinline autoplay></video>
  <div id="live-badge">🔴 LIVE</div>
  <div id="watermark">
    <div id="wdot"></div>
    <div id="wtxt">JasurTV</div>
  </div>
  <div id="viewers">👁 <span id="vcnt">0</span></div>
  <div id="bottom-bar">
    <div id="show-title">JasurTV</div>
    <div id="show-type"></div>
  </div>
</div>

<script>
const SERVER = "https://kino-server-1.onrender.com";
const tg     = window.Telegram?.WebApp;
const params = new URLSearchParams(location.search);
const UID    = params.get("uid") || (tg?.initDataUnsafe?.user?.id || 0);

if (tg) { tg.expand(); tg.enableClosingConfirmation(); }

const vid       = document.getElementById("vid");
const loading   = document.getElementById("loading");
const loadingTxt= document.getElementById("loading-txt");
const retryBtn  = document.getElementById("retry-btn");
const nosignal  = document.getElementById("nosignal");
const liveBadge = document.getElementById("live-badge");
const showTitle = document.getElementById("show-title");
const showType  = document.getElementById("show-type");
const vcnt      = document.getElementById("vcnt");
const nextInfo  = document.getElementById("next-info");
const nextTitle = document.getElementById("next-title");
const nextTime  = document.getElementById("next-time");

const TYPE_LABEL = {movie:"b/f", music:"🎵", show:"k/s", ads:"📢"};

let currentItemId = null;
let retryCount    = 0;
let pingInterval  = null;
let syncInterval  = null;

// ── Server uyg'onishi uchun kuting
async function fetchWithWakeup() {
  loadingTxt.textContent = "Server uyg'onmoqda...";

  // 3 marta urinish, har biri 8 soniya
  for (let i = 0; i < 5; i++) {
    try {
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(`${SERVER}/jasurtv/current`, { signal: ctrl.signal });
      clearTimeout(timeout);
      if (r.ok) {
        loadingTxt.textContent = "Yuklanmoqda...";
        return await r.json();
      }
    } catch(e) {}
    loadingTxt.textContent = `Ulanmoqda... (${i+1}/5)`;
    await new Promise(r => setTimeout(r, 3000));
  }
  return null;
}

async function fetchSchedule() {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch(`${SERVER}/jasurtv/current`, { signal: ctrl.signal });
    clearTimeout(timeout);
    return r.ok ? await r.json() : null;
  } catch(e) { return null; }
}

function retryInit() {
  retryBtn.style.display = "none";
  loading.style.display  = "flex";
  loadingTxt.textContent = "Qayta ulanmoqda...";
  setTimeout(init, 500);
}

async function init() {
  loading.style.display   = "flex";
  nosignal.style.display  = "none";
  liveBadge.style.display = "none";
  retryBtn.style.display  = "none";

  const data = retryCount === 0 ? await fetchWithWakeup() : await fetchSchedule();
  retryCount++;

  if (!data) {
    loadingTxt.textContent = "Server bilan aloqa yo'q";
    retryBtn.style.display = "block";
    return;
  }

  if (!data.current) {
    loading.style.display  = "none";
    nosignal.style.display = "flex";
    if (data.next) {
      nextTitle.textContent      = data.next.title;
      nextTime.textContent       = data.next.time + " da boshlanadi";
      nextInfo.style.display     = "block";
    }
    // 30 soniyada qayta tekshir
    setTimeout(init, 30000);
    return;
  }

  const item = data.current;
  const pos  = data.position_seconds || 0;

  showTitle.textContent = item.title || "JasurTV";
  showType.textContent  = TYPE_LABEL[item.type] || "";
  currentItemId         = item.id;

  const url = item.video_url || item.presigned_url || "";
  if (!url) {
    loading.style.display = "none";
    nosignal.style.display = "flex";
    nosignal.querySelector("h2").textContent = `📺 ${item.title}`;
    nosignal.querySelector("p").textContent  = "Video yuklanmoqda...";
    liveBadge.style.display = "none";
    setTimeout(init, 15000);
    return;
  }

  vid.src = url;
  vid.load();

  // 5 soniyadan so'ng play boshlashga harakat
  const playTimeout = setTimeout(() => {
    loading.style.display   = "none";
    liveBadge.style.display = "block";
    vid.play().catch(()=>{});
  }, 5000);

  vid.addEventListener("canplay", () => {
    clearTimeout(playTimeout);
    loading.style.display   = "none";
    liveBadge.style.display = "block";
    vid.currentTime = pos;
    vid.play().catch(()=>{});
  }, {once: true});

  vid.addEventListener("error", () => {
    clearTimeout(playTimeout);
    loading.style.display = "none";
    nosignal.style.display = "flex";
    liveBadge.style.display = "none";
    setTimeout(init, 15000);
  });

  vid.addEventListener("ended", () => {
    setTimeout(init, 2000);
  });
}

// Ping (viewer count)
async function pingViewer() {
  try {
    const r = await fetch(`${SERVER}/jasurtv/ping`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({uid: UID})
    });
    const d = await r.json();
    vcnt.textContent = d.viewers || 0;
  } catch(e) {}
}

// Jadval sync
async function syncSchedule() {
  const data = await fetchSchedule();
  if (!data?.current) return;
  if (data.current.id !== currentItemId) {
    currentItemId = null;
    retryCount = 0;
    init();
  }
}

// Start
init();
pingViewer();
if (pingInterval) clearInterval(pingInterval);
if (syncInterval) clearInterval(syncInterval);
pingInterval = setInterval(pingViewer,   30000);
syncInterval = setInterval(syncSchedule, 60000);
</script>
</body>
</html>
