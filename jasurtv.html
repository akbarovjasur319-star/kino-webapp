
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>📺 JasurTV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden}
#player-wrap{position:relative;width:100%;height:100vh;background:#000}
video{width:100%;height:100%;object-fit:contain}

#watermark{
  position:absolute;top:14px;right:14px;
  display:flex;align-items:center;gap:6px;
  pointer-events:none;z-index:10;
}
#wtxt{
  font-size:18px;font-weight:900;
  background:linear-gradient(135deg,#e50914,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:1px;
  animation:wmark 12s infinite;
}
#wdot{width:8px;height:8px;border-radius:50%;background:#e50914;animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes wmark{
  0%,8%{opacity:1;font-size:18px;letter-spacing:1px}
  10%,35%{opacity:.7;font-size:13px;letter-spacing:3px}
  37%,100%{opacity:1;font-size:18px;letter-spacing:1px}
}

#bottom-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  padding:32px 16px 16px;pointer-events:none;
}
#show-title{font-size:15px;font-weight:600;color:#fff;opacity:.9;}
#show-type{font-size:12px;color:#aaa;margin-top:2px;}

#live-badge{
  position:absolute;top:14px;left:14px;
  background:#e50914;color:#fff;
  font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:4px;letter-spacing:1px;
  animation:blink 2s ease-in-out infinite;
}

/* ═══════════════════════════════════════
   ULTRA PRO INTRO — Canvas + CSS3
═══════════════════════════════════════ */
#loading{
  position:absolute;inset:0;z-index:20;
  background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
#intro-canvas{
  position:absolute;inset:0;width:100%;height:100%;
}
#intro-content{
  position:relative;z-index:5;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  pointer-events:none;
}

/* Top bar */
#intro-topbar{
  position:absolute;top:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,#e50914,#ff6b00,#ffcc00,#ff6b00,#e50914,transparent);
  transform:scaleX(0);transform-origin:left;
  transition:transform 1.5s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 0 20px rgba(229,9,20,0.8);
  z-index:6;
}
#intro-botbar{
  position:absolute;bottom:0;left:0;right:0;
  height:3px;
  background:linear-gradient(90deg,transparent,#e50914,#ff6b00,#ffcc00,#ff6b00,#e50914,transparent);
  transform:scaleX(0);transform-origin:right;
  transition:transform 1.5s cubic-bezier(0.16,1,0.3,1) 0.2s;
  box-shadow:0 0 20px rgba(229,9,20,0.8);
  z-index:6;
}

/* Yon chiziqlar */
#intro-leftbar{
  position:absolute;left:0;top:0;bottom:0;
  width:3px;
  background:linear-gradient(180deg,transparent,#e50914,#ff6b00,#e50914,transparent);
  transform:scaleY(0);transform-origin:top;
  transition:transform 0.8s ease 1.5s;
  box-shadow:0 0 20px rgba(229,9,20,0.6);
  z-index:6;
}
#intro-rightbar{
  position:absolute;right:0;top:0;bottom:0;
  width:3px;
  background:linear-gradient(180deg,transparent,#e50914,#ff6b00,#e50914,transparent);
  transform:scaleY(0);transform-origin:bottom;
  transition:transform 0.8s ease 1.5s;
  box-shadow:0 0 20px rgba(229,9,20,0.6);
  z-index:6;
}

/* Corner badges — TILLA */
.corner{
  position:absolute;width:24px;height:24px;z-index:7;
  opacity:0;transition:opacity 0.4s;
}
#c-tl{top:10px;left:10px;border-top:2px solid #ffd700;border-left:2px solid #ffd700;
  box-shadow:-3px -3px 12px rgba(255,215,0,0.7);}
#c-tr{top:10px;right:10px;border-top:2px solid #ffd700;border-right:2px solid #ffd700;
  box-shadow:3px -3px 12px rgba(255,215,0,0.7);}
#c-bl{bottom:10px;left:10px;border-bottom:2px solid #ffd700;border-left:2px solid #ffd700;
  box-shadow:-3px 3px 12px rgba(255,215,0,0.7);}
#c-br{bottom:10px;right:10px;border-bottom:2px solid #ffd700;border-right:2px solid #ffd700;
  box-shadow:3px 3px 12px rgba(255,215,0,0.7);}

/* TV Icon — kattaroq va yorqinroq */
#tv-icon{
  font-size:72px;
  opacity:0;
  transform:scale(0.2) translateY(-30px);
  transition:opacity 0.8s, transform 1s cubic-bezier(0.34,1.56,0.64,1);
  margin-bottom:8px;
  filter:
    drop-shadow(0 0 20px rgba(255,215,0,1))
    drop-shadow(0 0 45px rgba(255,165,0,0.9))
    drop-shadow(0 0 70px rgba(229,9,20,0.6));
  animation:tvFloat 3.5s ease-in-out infinite;
}
@keyframes tvFloat{
  0%,100%{transform:translateY(0) scale(1) rotate(-1.5deg)}
  50%{transform:translateY(-12px) scale(1.08) rotate(1.5deg)}
}

/* JASUR badge — yorqin tilla shine */
#studio-badge{
  font-size:9px;letter-spacing:7px;
  background:linear-gradient(90deg,
    #5a3e00,#b8860b,#e6b800,#ffd700,#fffacd,#fff8dc,#ffd700,#e6b800,#b8860b,#5a3e00
  );
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:300% auto;
  animation:goldShine 2s linear infinite;
  text-transform:uppercase;font-family:Arial,sans-serif;font-weight:700;
  opacity:0;margin-bottom:20px;
  transition:opacity 0.8s,letter-spacing 1.4s;
  filter:drop-shadow(0 0 12px rgba(255,215,0,0.9));
}
@keyframes goldShine{
  0%{background-position:300% center}
  100%{background-position:-300% center}
}

/* Logo asosiy */
#logo-wrap{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  height:110px;overflow:visible;
}
#logo-glow{
  position:absolute;inset:-50px;
  background:radial-gradient(ellipse at center,rgba(229,9,20,0.7) 0%,rgba(255,107,0,0.4) 40%,transparent 70%);
  filter:blur(35px);opacity:0;z-index:-1;
  transition:opacity 1s;
  animation:glowPulse 2s ease-in-out infinite alternate;
}
@keyframes glowPulse{
  0%{transform:scale(0.9);opacity:0.5}
  100%{transform:scale(1.2);opacity:1}
}
.logo-char{
  font-size:86px;font-weight:900;
  display:inline-block;
  font-family:'Arial Black',Arial,sans-serif;
  opacity:0;position:relative;
  transition:opacity 0.01s,transform 0.65s cubic-bezier(0.34,1.56,0.64,1);
}
.logo-char.red{
  background:linear-gradient(160deg,#ff2200 0%,#e50914 45%,#ff6b00 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 22px rgba(229,9,20,1)) drop-shadow(0 0 45px rgba(229,9,20,0.6));
}
.logo-char.white{
  color:#ffffff;
  text-shadow:0 0 40px rgba(255,255,255,1),0 0 80px rgba(255,255,255,0.5),0 2px 4px rgba(0,0,0,0.9);
}

/* Chiziq — TILLA */
#deco-line{
  height:2px;width:0;margin-top:14px;
  background:linear-gradient(90deg,
    transparent 0%,#5a3e00 5%,
    #b8860b 15%,#ffd700 30%,#fffacd 50%,#ffd700 70%,
    #b8860b 85%,#5a3e00 95%,transparent 100%
  );
  box-shadow:0 0 20px rgba(255,215,0,1),0 0 45px rgba(255,165,0,0.7);
  transition:width 1.4s cubic-bezier(0.16,1,0.3,1);
}

/* Tagline — TILLA yorqin */
#tagline{
  font-size:10px;letter-spacing:12px;
  background:linear-gradient(90deg,
    #5a3e00,#b8860b,#e6b800,#ffd700,#fffacd,#fff8dc,#ffd700,#e6b800,#b8860b,#5a3e00
  );
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:300% auto;
  animation:goldShine 2s linear infinite;
  text-transform:uppercase;margin-top:12px;
  font-family:Arial,sans-serif;font-weight:600;
  opacity:0;
  transition:opacity 0.8s,letter-spacing 1.5s;
  filter:drop-shadow(0 0 10px rgba(255,215,0,0.8));
}

/* Stat bar */
#stat-bar{
  display:flex;gap:24px;margin-top:22px;opacity:0;
  transition:opacity 0.8s;
}
.stat-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
.stat-val{
  font-size:16px;font-weight:900;
  background:linear-gradient(160deg,#ff2200,#e50914,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  font-family:'Arial Black',sans-serif;
  filter:drop-shadow(0 0 10px rgba(229,9,20,0.9));
}
.stat-lbl{
  font-size:7px;letter-spacing:3px;
  background:linear-gradient(90deg,#5a3e00,#b8860b,#ffd700,#fffacd,#ffd700,#b8860b,#5a3e00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:300% auto;
  animation:goldShine 2s linear infinite;
  text-transform:uppercase;
  filter:drop-shadow(0 0 6px rgba(255,215,0,0.7));
}
.stat-sep{
  width:1px;height:32px;
  background:linear-gradient(180deg,transparent,rgba(255,215,0,0.6),transparent);
  align-self:center;box-shadow:0 0 8px rgba(255,215,0,0.5);
}

/* Progress bar — TILLA */
#prog-wrap{
  position:absolute;bottom:28px;left:36px;right:36px;
  opacity:0;transition:opacity 0.5s;z-index:6;
}
#prog-label{
  font-size:8px;letter-spacing:3px;
  background:linear-gradient(90deg,#5a3e00,#b8860b,#ffd700,#fffacd,#ffd700,#b8860b,#5a3e00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-size:300% auto;
  animation:goldShine 2s linear infinite;
  text-transform:uppercase;margin-bottom:7px;text-align:right;
  filter:drop-shadow(0 0 6px rgba(255,215,0,0.7));
}
#prog-track{
  height:2px;background:rgba(255,215,0,0.1);
  border-radius:2px;overflow:hidden;
  box-shadow:0 0 8px rgba(255,215,0,0.2);
}
#prog-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#5a3e00,#b8860b,#ffd700,#fffacd,#ffd700,#e50914);
  box-shadow:0 0 16px rgba(255,215,0,1),0 0 6px rgba(229,9,20,0.9);
  transition:width 0.1s linear;
}

/* Top/Bot frame — TILLA */
#intro-topbar{
  position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#b8860b,#ffd700,#fffacd,#ffd700,#b8860b,transparent);
  transform:scaleX(0);transform-origin:left;
  transition:transform 1.5s cubic-bezier(0.16,1,0.3,1);
  box-shadow:0 0 22px rgba(255,215,0,1),0 0 45px rgba(255,165,0,0.6);z-index:6;
}
#intro-botbar{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,#b8860b,#ffd700,#fffacd,#ffd700,#b8860b,transparent);
  transform:scaleX(0);transform-origin:right;
  transition:transform 1.5s cubic-bezier(0.16,1,0.3,1) 0.2s;
  box-shadow:0 0 22px rgba(255,215,0,1),0 0 45px rgba(255,165,0,0.6);z-index:6;
}
#intro-leftbar{
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent,#b8860b,#ffd700,#b8860b,transparent);
  transform:scaleY(0);transform-origin:top;
  transition:transform 0.8s ease 1.5s;
  box-shadow:0 0 18px rgba(255,215,0,0.8);z-index:6;
}
#intro-rightbar{
  position:absolute;right:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,transparent,#b8860b,#ffd700,#b8860b,transparent);
  transform:scaleY(0);transform-origin:bottom;
  transition:transform 0.8s ease 1.5s;
  box-shadow:0 0 18px rgba(255,215,0,0.8);z-index:6;
}

/* Spinner */
#loading-spin{display:none;}
#loading-txt{display:none;}

/* Retry */
#retry-btn{
  position:absolute;bottom:60px;
  background:rgba(229,9,20,0.9);color:#fff;
  border:none;padding:12px 28px;border-radius:4px;
  font-size:13px;cursor:pointer;display:none;
  letter-spacing:2px;text-transform:uppercase;
  z-index:10;
}
#nosignal{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0a0a0a;z-index:15;
}
#nosignal h2{font-size:22px;margin-bottom:8px}
#nosignal p{color:#888;font-size:14px;text-align:center;padding:0 32px}
#next-info{
  margin-top:20px;background:#111;border-radius:12px;
  padding:14px 20px;text-align:center;max-width:280px;
}
#next-info h3{font-size:14px;color:#e50914;margin-bottom:6px}
#next-info p{font-size:15px;font-weight:600}

#viewers{
  position:absolute;top:14px;left:70px;
  background:rgba(0,0,0,.6);border-radius:20px;
  padding:4px 10px;font-size:12px;color:#ccc;
  display:flex;align-items:center;gap:5px;
}
</style>
</head>
<body>
<div id="player-wrap">
  <div id="loading">
    <canvas id="intro-canvas"></canvas>
    <div id="intro-topbar"></div>
    <div id="intro-botbar"></div>
    <div id="intro-leftbar"></div>
    <div id="intro-rightbar"></div>
    <div class="corner" id="c-tl"></div>
    <div class="corner" id="c-tr"></div>
    <div class="corner" id="c-bl"></div>
    <div class="corner" id="c-br"></div>
    <div id="intro-content">
      <div id="tv-icon">📺</div>
      <div id="studio-badge">✦ Jasur Studios &nbsp;•&nbsp; Original Content ✦</div>
      <div id="logo-wrap">
        <div id="logo-glow"></div>
        <span class="logo-char red"   id="c-J">J</span>
        <span class="logo-char white" id="c-a">a</span>
        <span class="logo-char white" id="c-s">s</span>
        <span class="logo-char white" id="c-u">u</span>
        <span class="logo-char white" id="c-r">r</span>
        <span class="logo-char red"   id="c-T">T</span>
        <span class="logo-char red"   id="c-V">V</span>
      </div>
      <div id="deco-line"></div>
      <div id="tagline">✦ &nbsp; watch &nbsp;•&nbsp; enjoy &nbsp;•&nbsp; repeat &nbsp; ✦</div>
      <div id="stat-bar">
        <div class="stat-item">
          <div class="stat-val">4K</div>
          <div class="stat-lbl">✦ Ultra HD ✦</div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <div class="stat-val">24/7</div>
          <div class="stat-lbl">✦ Live ✦</div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <div class="stat-val">UZ</div>
          <div class="stat-lbl">✦ Original ✦</div>
        </div>
      </div>
    </div>
    <div id="prog-wrap">
      <div id="prog-label">Yuklanmoqda...</div>
      <div id="prog-track"><div id="prog-fill"></div></div>
    </div>
    <div id="loading-spin"></div>
    <div id="loading-txt"></div>
    <button id="retry-btn" onclick="retryInit()">🔄 Qayta urinish</button>
  </div>
  <div id="nosignal">
    <div style="font-size:48px">📺</div>
    <h2>Hozir efir yo'q</h2>
    <p>Tez orada yangi efir boshlanadi</p>
    <div id="next-info" style="display:none">
      <h3>⏰ Keyingi efir</h3>
      <p id="next-title"></p>
      <p id="next-time" style="color:#e50914;font-size:13px;margin-top:4px"></p>
    </div>
  </div>
  <video id="vid" playsinline autoplay></video>
  <div id="live-badge">🔴 LIVE</div>
  <div id="watermark">
    <div id="wdot"></div>
    <div id="wtxt">JasurTV</div>
  </div>
  <div id="viewers">👁 <span id="vcnt">0</span></div>
  <div id="bottom-bar">
    <div id="show-title">JasurTV</div>
    <div id="show-type"></div>
  </div>
</div>

<script>
const SERVER = "https://jasurtv-server.onrender.com";
const tg     = window.Telegram?.WebApp;
const params = new URLSearchParams(location.search);
const UID    = params.get("uid") || (tg?.initDataUnsafe?.user?.id || 0);

if (tg) { tg.expand(); tg.enableClosingConfirmation(); }

const vid       = document.getElementById("vid");
const loading   = document.getElementById("loading");
const loadingTxt= document.getElementById("loading-txt");
const retryBtn  = document.getElementById("retry-btn");
const nosignal  = document.getElementById("nosignal");
const liveBadge = document.getElementById("live-badge");
const showTitle = document.getElementById("show-title");
const showType  = document.getElementById("show-type");
const vcnt      = document.getElementById("vcnt");
const nextInfo  = document.getElementById("next-info");
const nextTitle = document.getElementById("next-title");
const nextTime  = document.getElementById("next-time");

const TYPE_LABEL = {movie:"b/f", music:"🎵", show:"k/s", ads:"📢"};

let currentItemId = null;
let retryCount    = 0;
let pingInterval  = null;
let syncInterval  = null;

// ── Server uyg'onishi uchun kuting
async function fetchWithWakeup() {
  loadingTxt.textContent = "Server uyg'onmoqda...";

  // 3 marta urinish, har biri 8 soniya
  for (let i = 0; i < 5; i++) {
    try {
      const ctrl = new AbortController();
      const timeout = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(`${SERVER}/jasurtv/current`, { signal: ctrl.signal });
      clearTimeout(timeout);
      if (r.ok) {
        loadingTxt.textContent = "Yuklanmoqda...";
        return await r.json();
      }
    } catch(e) {}
    loadingTxt.textContent = `Ulanmoqda... (${i+1}/5)`;
    await new Promise(r => setTimeout(r, 3000));
  }
  return null;
}

async function fetchSchedule() {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 10000);
    const r = await fetch(`${SERVER}/jasurtv/current`, { signal: ctrl.signal });
    clearTimeout(timeout);
    return r.ok ? await r.json() : null;
  } catch(e) { return null; }
}

function retryInit() {
  retryBtn.style.display = "none";
  loading.style.display  = "flex";
  loadingTxt.textContent = "Qayta ulanmoqda...";
  setTimeout(init, 500);
}

async function init() {
  loading.style.display   = "flex";
  nosignal.style.display  = "none";
  liveBadge.style.display = "none";
  retryBtn.style.display  = "none";

  const data = retryCount === 0 ? await fetchWithWakeup() : await fetchSchedule();
  retryCount++;

  if (!data) {
    loadingTxt.textContent = "Server bilan aloqa yo'q";
    retryBtn.style.display = "block";
    return;
  }

  if (!data.current) {
    loading.style.display  = "none";
    nosignal.style.display = "flex";
    if (data.next) {
      nextTitle.textContent      = data.next.title;
      nextTime.textContent       = data.next.time + " da boshlanadi";
      nextInfo.style.display     = "block";
    }
    // 30 soniyada qayta tekshir
    setTimeout(init, 30000);
    return;
  }

  const item = data.current;
  const pos  = data.position_seconds || 0;

  showTitle.textContent = item.title || "JasurTV";
  showType.textContent  = TYPE_LABEL[item.type] || "";
  currentItemId         = item.id;

  const url = item.video_url || item.presigned_url || "";
  if (!url) {
    loading.style.display = "none";
    nosignal.style.display = "flex";
    nosignal.querySelector("h2").textContent = `📺 ${item.title}`;
    nosignal.querySelector("p").textContent  = "Video yuklanmoqda...";
    liveBadge.style.display = "none";
    setTimeout(init, 15000);
    return;
  }

  vid.src = url;
  vid.load();

  // 5 soniyadan so'ng play boshlashga harakat
  const playTimeout = setTimeout(() => {
    loading.style.display   = "none";
    liveBadge.style.display = "block";
    vid.play().catch(()=>{});
  }, 5000);

  vid.addEventListener("canplay", () => {
    clearTimeout(playTimeout);
    loading.style.display   = "none";
    liveBadge.style.display = "block";
    vid.currentTime = pos;
    vid.play().catch(()=>{});
  }, {once: true});

  let errorCount = 0;
  vid.addEventListener("error", async () => {
    clearTimeout(playTimeout);
    errorCount++;
    if (errorCount <= 3) {
      // URL eskirgan bo'lishi mumkin — serverdan yangi URL olish
      loadingTxt.textContent = `URL yangilanmoqda... (${errorCount}/3)`;
      loading.style.display  = "flex";
      liveBadge.style.display = "none";
      await new Promise(r => setTimeout(r, 2000));
      const fresh = await fetchSchedule();
      if (fresh?.current?.video_url && fresh.current.id === currentItemId) {
        const newUrl = fresh.current.video_url;
        const newPos = fresh.position_seconds || 0;
        vid.src = newUrl;
        vid.load();
        vid.addEventListener("canplay", () => {
          loading.style.display   = "none";
          liveBadge.style.display = "block";
          vid.currentTime = newPos;
          vid.play().catch(()=>{});
        }, {once: true});
        return;
      }
    }
    // 3 marta urinib bo'lsa — nosignal
    loading.style.display   = "none";
    nosignal.style.display  = "flex";
    liveBadge.style.display = "none";
    nosignal.querySelector("h2").textContent = "📺 Video yuklanmadi";
    nosignal.querySelector("p").textContent  = "Internet yoki server muammosi";
    setTimeout(()=>{ errorCount=0; init(); }, 20000);
  });

  vid.addEventListener("ended", () => {
    setTimeout(init, 2000);
  });

  // Har 30 soniyada position tekshir — agar video qotib qolsa qayta boshlash
  let lastTime = -1;
  let frozenCount = 0;
  const frozenCheck = setInterval(() => {
    if (!vid.paused && !vid.ended) {
      if (Math.abs(vid.currentTime - lastTime) < 0.5) {
        frozenCount++;
        if (frozenCount >= 3) {
          // Video qotib qolgan — qayta play
          frozenCount = 0;
          vid.play().catch(()=>{ clearInterval(frozenCheck); init(); });
        }
      } else {
        frozenCount = 0;
      }
      lastTime = vid.currentTime;
    }
  }, 10000);
}

// Ping (viewer count)
async function pingViewer() {
  try {
    const r = await fetch(`${SERVER}/jasurtv/ping`, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({uid: UID})
    });
    const d = await r.json();
    vcnt.textContent = d.viewers || 0;
  } catch(e) {}
}

// Jadval sync
async function syncSchedule() {
  const data = await fetchSchedule();
  if (!data?.current) return;
  if (data.current.id !== currentItemId) {
    currentItemId = null;
    retryCount = 0;
    init();
  }
}

// ══════════════════════════════════════
//  ULTRA PRO INTRO — Canvas Particle Engine
// ══════════════════════════════════════
const canvas = document.getElementById('intro-canvas');
const ctx    = canvas.getContext('2d');
let W, H, particles=[], animId;

function resizeCanvas(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Particle class
class Particle {
  constructor(type='star'){
    this.type  = type;
    this.reset();
  }
  reset(){
    this.x     = Math.random()*W;
    this.y     = Math.random()*H;
    this.size  = Math.random()*2.5+0.3;
    this.alpha = Math.random();
    this.vx    = (Math.random()-0.5)*0.3;
    this.vy    = (Math.random()-0.5)*0.3;
    this.pulse = Math.random()*Math.PI*2;
    const palettes = [
      ['#e50914','#ff2200'],
      ['#ff6b00','#ffaa00'],
      ['#cc00ff','#8800cc'],
      ['#0088ff','#00ccff'],
      ['#ffffff','#cccccc'],
      ['#ff0066','#cc0044'],
    ];
    const p = palettes[Math.floor(Math.random()*palettes.length)];
    this.color = p[0];
    this.color2= p[1];
    if(this.type==='meteor'){
      this.x  = Math.random()*W*1.5-W*0.2;
      this.y  = Math.random()*H*0.5-50;
      this.vx = Math.random()*6+4;
      this.vy = Math.random()*3+2;
      this.len= Math.random()*120+60;
      this.alpha=1;
    }
    if(this.type==='orb'){
      this.size  = Math.random()*4+2;
      this.vx    = (Math.random()-0.5)*0.6;
      this.vy    = (Math.random()-0.5)*0.6;
    }
  }
  update(){
    this.x += this.vx;
    this.y += this.vy;
    this.pulse += 0.03;
    if(this.type==='star'){
      this.alpha = 0.3+Math.sin(this.pulse)*0.6;
    }
    if(this.type==='meteor'){
      this.alpha -= 0.015;
      if(this.alpha<=0) this.reset();
    }
    if(this.type==='orb'){
      this.alpha = 0.4+Math.sin(this.pulse)*0.4;
    }
    if(this.x<-50||this.x>W+50||this.y<-50||this.y>H+50){
      this.x=Math.random()*W; this.y=Math.random()*H;
    }
  }
  draw(){
    ctx.save();
    ctx.globalAlpha = Math.max(0,this.alpha);
    if(this.type==='star'){
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.shadowBlur = this.size*4;
      ctx.shadowColor= this.color;
      ctx.fill();
    }
    else if(this.type==='meteor'){
      ctx.beginPath();
      ctx.moveTo(this.x,this.y);
      ctx.lineTo(this.x-this.len*0.7,this.y-this.len*0.4);
      const g = ctx.createLinearGradient(this.x,this.y,this.x-this.len*0.7,this.y-this.len*0.4);
      g.addColorStop(0,this.color);
      g.addColorStop(0.5,'rgba(255,255,255,0.8)');
      g.addColorStop(1,'transparent');
      ctx.strokeStyle=g;
      ctx.lineWidth=1.5;
      ctx.stroke();
    }
    else if(this.type==='orb'){
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*3);
      g.addColorStop(0,this.color);
      g.addColorStop(0.5,this.color2);
      g.addColorStop(1,'transparent');
      ctx.beginPath();
      ctx.arc(this.x,this.y,this.size*3,0,Math.PI*2);
      ctx.fillStyle=g;
      ctx.fill();
    }
    ctx.restore();
  }
}

// Fon gradient — aylanuvchi nebula
let bgAngle=0;
function drawBg(){
  const cx=W/2, cy=H/2;
  bgAngle+=0.003;
  const g=ctx.createRadialGradient(cx+Math.cos(bgAngle)*W*0.15,cy+Math.sin(bgAngle)*H*0.15,0,cx,cy,Math.max(W,H)*0.8);
  g.addColorStop(0,'#1a0008');
  g.addColorStop(0.3,'#0d0015');
  g.addColorStop(0.6,'#05000e');
  g.addColorStop(1,'#000000');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  // Nebula qatlami
  const n1=ctx.createRadialGradient(W*0.2+Math.cos(bgAngle*0.7)*W*0.1,H*0.5,0,W*0.2,H*0.5,W*0.5);
  n1.addColorStop(0,'rgba(229,9,20,0.12)');
  n1.addColorStop(1,'transparent');
  ctx.fillStyle=n1;ctx.fillRect(0,0,W,H);

  const n2=ctx.createRadialGradient(W*0.8+Math.cos(bgAngle*0.5)*W*0.1,H*0.3,0,W*0.8,H*0.3,W*0.4);
  n2.addColorStop(0,'rgba(180,0,255,0.1)');
  n2.addColorStop(1,'transparent');
  ctx.fillStyle=n2;ctx.fillRect(0,0,W,H);

  const n3=ctx.createRadialGradient(W*0.5,H*0.8+Math.sin(bgAngle*0.4)*H*0.1,0,W*0.5,H*0.8,W*0.4);
  n3.addColorStop(0,'rgba(0,100,255,0.08)');
  n3.addColorStop(1,'transparent');
  ctx.fillStyle=n3;ctx.fillRect(0,0,W,H);
}

function createParticles(){
  particles=[];
  for(let i=0;i<120;i++) particles.push(new Particle('star'));
  for(let i=0;i<25;i++)  particles.push(new Particle('orb'));
  for(let i=0;i<8;i++)   particles.push(new Particle('meteor'));
}

function canvasLoop(){
  drawBg();
  particles.forEach(p=>{p.update();p.draw();});
  animId=requestAnimationFrame(canvasLoop);
}

// ══════════════════════════════════════
//  15 SONIYALIK PRO INTRO
// ══════════════════════════════════════
function runIntro(){
  return new Promise(resolve=>{
    createParticles();
    canvasLoop();

    const topbar  = document.getElementById('intro-topbar');
    const botbar  = document.getElementById('intro-botbar');
    const leftbar = document.getElementById('intro-leftbar');
    const rightbar= document.getElementById('intro-rightbar');
    const corners = ['c-tl','c-tr','c-bl','c-br'].map(id=>document.getElementById(id));
    const badge   = document.getElementById('studio-badge');
    const glow    = document.getElementById('logo-glow');
    const dline   = document.getElementById('deco-line');
    const tag     = document.getElementById('tagline');
    const statBar = document.getElementById('stat-bar');
    const progW   = document.getElementById('prog-wrap');
    const progFill= document.getElementById('prog-fill');
    const progLbl = document.getElementById('prog-label');
    const els     = ['c-J','c-a','c-s','c-u','c-r','c-T','c-V'].map(id=>document.getElementById(id));

    // Boshlang'ich holat
    els.forEach(el=>{
      el.style.transform='translateY(80px) scale(0.4)';
      el.style.opacity='0';
    });

    // ── FAZA 1 (0-1.5s): Neon frame chiziladi ──
    setTimeout(()=>{
      topbar.style.transform ='scaleX(1)';
      botbar.style.transform ='scaleX(1)';
    },100);
    setTimeout(()=>{
      leftbar.style.transform ='scaleY(1)';
      rightbar.style.transform='scaleY(1)';
    },1600);
    setTimeout(()=>{
      corners.forEach(c=>c.style.opacity='1');
    },2300);

    // ── FAZA 2 (2.5s): Studio badge ──
    setTimeout(()=>{
      badge.style.opacity='1';
      badge.style.letterSpacing='10px';
    },2500);

    // ── FAZA 3 (3.5-5.5s): Logo harflari chiqadi ──
    setTimeout(()=>{
      els.forEach((el,i)=>{
        setTimeout(()=>{
          el.style.opacity='1';
          el.style.transform='translateY(0) scale(1)';
        },i*130);
      });
    },3500);

    // ── FAZA 4 (5s): Glow + deco chiziq ──
    setTimeout(()=>{
      glow.style.opacity='1';
    },5200);
    setTimeout(()=>{
      dline.style.width='260px';
    },5500);
    setTimeout(()=>{
      tag.style.opacity='1';
      tag.style.letterSpacing='12px';
      tag.style.color='rgba(255,255,255,0.45)';
    },6200);

    // ── FAZA 5 (7-9s): Logo rang pulsatsiyasi ──
    const colorCycle=[
      {j:'drop-shadow(0 0 25px #e50914) drop-shadow(0 0 50px rgba(229,9,20,0.5))',tv:'drop-shadow(0 0 25px #ff6b00)'},
      {j:'drop-shadow(0 0 25px #ff0066) drop-shadow(0 0 50px rgba(255,0,102,0.5))',tv:'drop-shadow(0 0 25px #cc00ff)'},
      {j:'drop-shadow(0 0 25px #0088ff) drop-shadow(0 0 50px rgba(0,136,255,0.5))',tv:'drop-shadow(0 0 25px #00ccff)'},
      {j:'drop-shadow(0 0 25px #ffcc00) drop-shadow(0 0 50px rgba(255,204,0,0.5))',tv:'drop-shadow(0 0 25px #ff6b00)'},
      {j:'drop-shadow(0 0 25px #e50914) drop-shadow(0 0 50px rgba(229,9,20,0.5))',tv:'drop-shadow(0 0 25px #ff6b00)'},
    ];
    colorCycle.forEach((c,i)=>{
      setTimeout(()=>{
        document.getElementById('c-J').style.filter=c.j;
        document.getElementById('c-T').style.filter=c.tv;
        document.getElementById('c-V').style.filter=c.tv;
      },7000+i*500);
    });

    // Stat bar
    setTimeout(()=>{
      statBar.style.opacity='1';
    },7500);

    // ── FAZA 6 (9.5s): "ur" yo'qoladi → JasTV ──
    setTimeout(()=>{
      tag.style.opacity='0';
      ['c-u','c-r'].forEach(id=>{
        const el=document.getElementById(id);
        el.style.transition='opacity 0.5s,transform 0.5s,font-size 0.4s 0.1s';
        el.style.opacity='0';
        el.style.transform='translateY(-50px) scale(0)';
        el.style.fontSize='0';
      });
      setTimeout(()=>{
        ['c-J','c-a','c-s','c-T','c-V'].forEach(id=>{
          const el=document.getElementById(id);
          el.style.transition='font-size 0.7s cubic-bezier(0.34,1.56,0.64,1),letter-spacing 0.7s';
          el.style.fontSize='100px';
          el.style.letterSpacing='10px';
        });
        dline.style.width='200px';
        glow.style.background='radial-gradient(ellipse at center,rgba(229,9,20,0.8) 0%,rgba(255,107,0,0.5) 40%,transparent 70%)';
      },600);
      setTimeout(()=>{
        tag.textContent='JasTV  •  LIVE  •  24/7';
        tag.style.color='rgba(229,9,20,0.9)';
        tag.style.letterSpacing='6px';
        tag.style.transition='opacity 0.8s,letter-spacing 1s';
        tag.style.opacity='1';
      },900);
    },9500);

    // ── FAZA 7 (12s): Progress bar ──
    setTimeout(()=>{
      progW.style.opacity='1';
      let prog=0;
      const pInt=setInterval(()=>{
        prog+=1.5;
        progFill.style.width=prog+'%';
        if(prog<40) progLbl.textContent='Server bilan ulanmoqda...';
        else if(prog<75) progLbl.textContent='Video tayyorlanmoqda...';
        else progLbl.textContent='Efirga kirmoqda...';
        if(prog>=100) clearInterval(pInt);
      },50);
    },12000);

    // ── TUGASH 15s ──
    setTimeout(()=>{
      cancelAnimationFrame(animId);
      resolve();
    },15000);
  });
}

// Start
(async () => {
  await runIntro();
  init();
})();
pingViewer();
if (pingInterval) clearInterval(pingInterval);
if (syncInterval) clearInterval(syncInterval);
pingInterval = setInterval(pingViewer,   30000);
syncInterval = setInterval(syncSchedule, 60000);
