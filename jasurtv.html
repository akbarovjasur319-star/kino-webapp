<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>📺 JasurTV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,sans-serif;height:100vh;overflow:hidden}
#player-wrap{position:relative;width:100%;height:100vh;background:#000}
video{width:100%;height:100%;object-fit:contain}

/* ── WATERMARK ── */
#watermark{
  position:absolute;top:14px;right:14px;
  display:flex;align-items:center;gap:6px;
  pointer-events:none;z-index:10;
}
#wtxt{
  font-size:18px;font-weight:900;
  background:linear-gradient(135deg,#e50914,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;letter-spacing:1px;
  animation:wmark 12s infinite;
}
#wdot{
  width:8px;height:8px;border-radius:50%;
  background:#e50914;
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes wmark{
  0%,8%{opacity:1;font-size:18px;letter-spacing:1px}
  10%,35%{opacity:.7;font-size:13px;letter-spacing:3px}
  37%,100%{opacity:1;font-size:18px;letter-spacing:1px}
}

/* ── PASTKI KINO NOMI ── */
#bottom-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,.85));
  padding:32px 16px 16px;
  pointer-events:none;
}
#show-title{
  font-size:15px;font-weight:600;
  color:#fff;opacity:.9;
  text-shadow:0 1px 4px rgba(0,0,0,.8);
}
#show-type{
  font-size:12px;color:#aaa;margin-top:2px;
}

/* ── LIVE BADGE ── */
#live-badge{
  position:absolute;top:14px;left:14px;
  background:#e50914;color:#fff;
  font-size:11px;font-weight:700;
  padding:3px 8px;border-radius:4px;
  letter-spacing:1px;
  animation:blink 2s ease-in-out infinite;
}

/* ── LOADING ── */
#loading{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#000;z-index:20;
}
#loading-logo{
  font-size:48px;font-weight:900;
  background:linear-gradient(135deg,#e50914,#ff6b00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:16px;letter-spacing:2px;
}
#loading-spin{
  width:40px;height:40px;
  border:3px solid #333;border-top-color:#e50914;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:12px;
}
#loading-txt{font-size:13px;color:#888}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── NO SIGNAL ── */
#nosignal{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0a0a0a;z-index:15;
}
#nosignal h2{font-size:22px;margin-bottom:8px}
#nosignal p{color:#888;font-size:14px;text-align:center;padding:0 32px}
#next-info{
  margin-top:20px;background:#111;border-radius:12px;
  padding:14px 20px;text-align:center;max-width:280px;
}
#next-info h3{font-size:14px;color:#e50914;margin-bottom:6px}
#next-info p{font-size:15px;font-weight:600}

/* ── VIEWERS ── */
#viewers{
  position:absolute;top:14px;left:70px;
  background:rgba(0,0,0,.6);border-radius:20px;
  padding:4px 10px;font-size:12px;color:#ccc;
  display:flex;align-items:center;gap:5px;
}
#viewers span{color:#e50914}
</style>
</head>
<body>

<div id="player-wrap">
  <!-- Loading -->
  <div id="loading">
    <div id="loading-logo">JasurTV</div>
    <div id="loading-spin"></div>
    <div id="loading-txt">Yuklanmoqda...</div>
  </div>

  <!-- No signal -->
  <div id="nosignal">
    <div style="font-size:48px">📺</div>
    <h2>Hozir efir yo'q</h2>
    <p>Tez orada yangi efir boshlanadi</p>
    <div id="next-info" style="display:none">
      <h3>⏰ Keyingi efir</h3>
      <p id="next-title"></p>
      <p id="next-time" style="color:#e50914;font-size:13px;margin-top:4px"></p>
    </div>
  </div>

  <!-- Video -->
  <video id="vid" playsinline autoplay></video>

  <!-- LIVE badge -->
  <div id="live-badge">🔴 LIVE</div>

  <!-- Watermark -->
  <div id="watermark">
    <div id="wdot"></div>
    <div id="wtxt">JasurTV</div>
  </div>

  <!-- Viewers -->
  <div id="viewers">👁 <span id="vcnt">0</span></div>

  <!-- Bottom bar -->
  <div id="bottom-bar">
    <div id="show-title">JasurTV</div>
    <div id="show-type"></div>
  </div>
</div>

<script>
const SERVER = "https://kino-server-1.onrender.com";
const tg     = window.Telegram?.WebApp;
const params = new URLSearchParams(location.search);
const UID    = params.get("uid") || (tg?.initDataUnsafe?.user?.id || 0);
const POS    = parseInt(params.get("pos") || "0");

if (tg) { tg.expand(); tg.enableClosingConfirmation(); }

const vid      = document.getElementById("vid");
const loading  = document.getElementById("loading");
const nosignal = document.getElementById("nosignal");
const liveBadge= document.getElementById("live-badge");
const showTitle= document.getElementById("show-title");
const showType = document.getElementById("show-type");
const vcnt     = document.getElementById("vcnt");
const nextInfo = document.getElementById("next-info");
const nextTitle= document.getElementById("next-title");
const nextTime = document.getElementById("next-time");

const TYPE_LABEL = {movie:"b/f", music:"🎵", show:"k/s", ads:"📢"};

async function fetchSchedule() {
  try {
    const r = await fetch(`${SERVER}/jasurtv/current`);
    return await r.json();
  } catch(e) {
    return null;
  }
}

async function init() {
  const data = await fetchSchedule();

  if (!data || !data.current) {
    // Efir yo'q
    loading.style.display  = "none";
    nosignal.style.display = "flex";
    liveBadge.style.display = "none";
    if (data?.next) {
      nextTitle.textContent = data.next.title;
      nextTime.textContent  = data.next.time + " da boshlanadi";
      nextInfo.style.display = "block";
    }
    return;
  }

  const item = data.current;
  const pos  = data.position_seconds || POS;

  // Kino nomini ko'rsat
  showTitle.textContent = item.title || "JasurTV";
  showType.textContent  = TYPE_LABEL[item.type] || "";

  // Video URL
  const url = item.video_url || item.presigned_url || "";
  if (!url) {
    // URL yo'q — faqat info ko'rsat
    loading.style.display = "none";
    nosignal.style.display = "flex";
    nosignal.querySelector("h2").textContent = `📺 ${item.title}`;
    nosignal.querySelector("p").textContent  = "Video yuklanmoqda...";
    liveBadge.style.display = "none";
    return;
  }

  vid.src = url;
  vid.load();
  vid.currentTime = pos;

  vid.addEventListener("canplay", () => {
    loading.style.display = "none";
    vid.play().catch(()=>{});
  }, {once: true});

  vid.addEventListener("error", () => {
    loading.style.display = "none";
    nosignal.style.display = "flex";
    liveBadge.style.display = "none";
  });

  // Auto-next: kino tugaganda keyingisiga o'tish
  vid.addEventListener("ended", () => {
    setTimeout(init, 2000);
  });
}

// Viewers yuborish
async function pingViewer() {
  try {
    const r = await fetch(`${SERVER}/jasurtv/ping`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({uid: UID})
    });
    const d = await r.json();
    vcnt.textContent = d.viewers || 0;
  } catch(e) {}
}

// Har 30 soniyada schedule yangilash (kino o'tganda)
async function syncSchedule() {
  const data = await fetchSchedule();
  if (!data) return;

  if (data.current) {
    showTitle.textContent = data.current.title || "JasurTV";
    showType.textContent  = TYPE_LABEL[data.current.type] || "";
    // Vaqt farqi 5 sekunddan oshsa sync qilish
    const serverPos = data.position_seconds || 0;
    if (Math.abs(vid.currentTime - serverPos) > 5) {
      vid.currentTime = serverPos;
    }
    // Agar yangi kino boshlangan bo'lsa
    if (data.current.id !== currentItemId) {
      currentItemId = data.current.id;
      init();
    }
  }
}

let currentItemId = null;

// Start
init();
pingViewer();
setInterval(pingViewer,   30000);  // 30 soniya
setInterval(syncSchedule, 60000);  // 1 daqiqa
</script>
</body>
</html>
