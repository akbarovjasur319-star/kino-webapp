<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 KinoUz</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap');

  :root {
    --bg: #0a0a0f;
    --card: #13131a;
    --accent: #e50914;
    --accent2: #ff6b35;
    --gold: #f5c518;
    --text: #ffffff;
    --muted: #8a8a9a;
    --border: #1e1e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Header */
  .header {
    background: linear-gradient(180deg, #000 0%, transparent 100%);
    padding: 16px 16px 8px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(20px);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -1px;
  }

  .logo span { color: var(--accent); }

  .search-box {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 8px 14px;
    gap: 8px;
  }

  .search-box input {
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    width: 100%;
  }

  .search-box input::placeholder { color: var(--muted); }

  /* Janrlar */
  .genres-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 16px 12px;
    scrollbar-width: none;
  }

  .genres-scroll::-webkit-scrollbar { display: none; }

  .genre-chip {
    flex-shrink: 0;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid var(--border);
    color: var(--muted);
    background: var(--card);
    transition: all 0.2s;
    white-space: nowrap;
  }

  .genre-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Kinolar grid */
  .movies-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 100px;
  }

  .movie-card {
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    animation: fadeIn 0.4s ease both;
  }

  .movie-card:active { transform: scale(0.97); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .movie-poster {
    width: 100%;
    aspect-ratio: 2/3;
    object-fit: cover;
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
  }

  .movie-poster-placeholder {
    width: 100%;
    aspect-ratio: 2/3;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }

  .movie-info {
    padding: 10px;
  }

  .movie-title {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .movie-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
  }

  .rating {
    color: var(--gold);
    font-weight: 700;
    font-size: 12px;
  }

  .year { color: var(--muted); }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(8px);
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
    border-top: 1px solid var(--border);
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 12px auto 0;
  }

  .modal-content { padding: 16px; }

  .modal-poster {
    width: 100%;
    border-radius: 16px;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    margin-bottom: 16px;
  }

  .modal-poster-placeholder {
    width: 100%;
    border-radius: 16px;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    margin-bottom: 16px;
  }

  .modal-title {
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .modal-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }

  .badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-rating { background: #f5c51820; color: var(--gold); }
  .badge-year { background: #ffffff10; color: var(--muted); }
  .badge-genre { background: #e5091420; color: var(--accent); }

  .modal-desc {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    background: #0a0a0f;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
  }

  .tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--accent);
    color: white;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Video player */
  .video-container {
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16/9;
    margin-bottom: 12px;
  }

  .video-container video {
    width: 100%;
    height: 100%;
  }

  .video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .no-video {
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 14px;
  }

  .no-video span { font-size: 40px; }

  /* Close btn */
  .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    border: none;
    color: white;
  }

  /* Loading */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .empty span { font-size: 48px; display: block; margin-bottom: 12px; }

.logo-letter {
  display: inline-block;
  opacity: 0;
  transform: translateY(-40px) scale(0.5);
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.logo-letter.drop {
  opacity: 1;
  transform: translateY(0) scale(1);
}
.logo-letter.spread {
  letter-spacing: 4px;
  transition: letter-spacing 0.5s ease;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="logo" id="animLogo">
      <span class="logo-letter" id="ll0">🎬</span>
      <span class="logo-letter" id="ll1">K</span>
      <span class="logo-letter" id="ll2">i</span>
      <span class="logo-letter" id="ll3">n</span>
      <span class="logo-letter" id="ll4" style="color:#e50914">o</span>
      <span class="logo-letter" id="ll5" style="color:#e50914">U</span>
      <span class="logo-letter" id="ll6" style="color:#e50914">z</span>
    </div>
    <div style="font-size:13px;font-weight:700;color:#e50914;letter-spacing:0.5px;">JasurStudio</div>
  </div>
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Kino qidirish...">
  </div>
</div>

<div class="genres-scroll" id="genresList"></div>

<div class="movies-grid" id="moviesList">
  <div class="loading" style="grid-column:1/-1">
    <div class="spinner"></div>
    <span>Yuklanmoqda...</span>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-content">
      <div id="modalPoster" class="modal-poster-placeholder">🎬</div>
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-badges" id="modalBadges"></div>
      <div class="modal-desc" id="modalDesc"></div>

      <div class="tabs">
        <div class="tab active" onclick="switchTab('trailer')">🎞️ Treyler</div>
        <div class="tab" onclick="switchTab('full')">🎬 To'liq Kino</div>
      </div>

      <div class="tab-content active" id="tab-trailer">
        <div id="trailerContainer"></div>
      </div>

      <div class="tab-content" id="tab-full">
        <div id="fullContainer"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Telegram WebApp
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); tg.setHeaderColor('#0a0a0f'); }

// Demo kinolar (bot movies.json dan yuklanadi)
let allMovies = [];
let currentGenre = 'all';
let currentMovie = null;

const genres = [
  { label: '🎬 Barchasi', value: 'all' },
  { label: '🚀 Fantastika', value: 'fantastika' },
  { label: '🎭 Drama', value: 'drama' },
  { label: '⚔️ Jangari', value: 'jangari' },
  { label: '😂 Komediya', value: 'komediya' },
  { label: '👻 Qo\'rqinchli', value: 'qorqinchli' },
  { label: '🏔️ Sarguzasht', value: 'sarguzasht' },
  { label: '❤️ Romantik', value: 'romantik' },
];

// Janrlarni chiqarish
function renderGenres() {
  const el = document.getElementById('genresList');
  el.innerHTML = genres.map(g => `
    <div class="genre-chip ${g.value === currentGenre ? 'active' : ''}" 
         onclick="filterGenre('${g.value}')">${g.label}</div>
  `).join('');
}

// Kinolarni yuklash
async function loadMovies() {
  try {
    const res = await fetch('https://raw.githubusercontent.com/akbarovjasur319-star/kino-webapp/main/movies.json?t=' + Date.now());
    const data = await res.json();
    allMovies = Object.values(data);
    renderMovies();
  } catch(e) {
    // Demo kinolar
    allMovies = [
      { id:"1", title:"Inception", year:2010, genre:"fantastika", rating:8.8, description:"Orzular ichida orzular...", file_id:"", trailer:"" },
      { id:"2", title:"Interstellar", year:2014, genre:"fantastika", rating:8.6, description:"Vaqt va makon chegarasidan o'tish...", file_id:"", trailer:"" },
      { id:"3", title:"The Dark Knight", year:2008, genre:"jangari", rating:9.0, description:"Gotham shahri himoyachisi...", file_id:"", trailer:"" },
    ];
    renderMovies();
  }
}

// Kinolarni ko'rsatish
function renderMovies() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let movies = allMovies;

  if (currentGenre !== 'all') {
    movies = movies.filter(m => m.genre === currentGenre);
  }

  if (search) {
    movies = movies.filter(m => m.title.toLowerCase().includes(search));
  }

  const el = document.getElementById('moviesList');

  if (movies.length === 0) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <span>😔</span>Bu bo'limda hozircha kino yo'q
    </div>`;
    return;
  }

  let html = '';
  movies.forEach(function(m, i) {
    const poster = m.poster ? '<img src="' + m.poster + '" style="width:100%;height:100%;object-fit:cover;border-radius:12px 12px 0 0">' : '🎬';
    html += '<div class="movie-card" style="animation-delay:' + (i * 0.05) + 's" onclick="openMovie(\'' + m.id + '\')">';
    html += '<div class="movie-poster-placeholder">' + poster + '</div>';
    html += '<div class="movie-info">';
    html += '<div class="movie-title">' + m.title + '</div>';
    html += '<div class="movie-meta"><span class="rating">⭐ ' + m.rating + '</span><span class="year">' + m.year + '</span></div>';
    html += '</div></div>';
  });
  el.innerHTML = html;
}

// Janr filter
function filterGenre(genre) {
  currentGenre = genre;
  renderGenres();
  renderMovies();
}

// Kino ochish
function openMovie(id) {
  currentMovie = allMovies.find(m => m.id === id);
  if (!currentMovie) return;

  document.getElementById('modalTitle').textContent = currentMovie.title;
  document.getElementById('modalDesc').textContent = currentMovie.description || 'Tavsif yo\'q';
  document.getElementById('modalBadges').innerHTML = `
    <span class="badge badge-rating">⭐ ${currentMovie.rating}/10</span>
    <span class="badge badge-year">📅 ${currentMovie.year}</span>
    <span class="badge badge-genre">📂 ${currentMovie.genre}</span>
  `;

  // Treyler
  renderVideo('trailerContainer', currentMovie.trailer || '');
  // To'liq kino
  renderVideo('fullContainer', currentMovie.full_video || currentMovie.trailer || '');

  // Default tab
  switchTab('trailer');

  document.getElementById('modalOverlay').classList.add('open');
}

const VIDEO_SERVER = "https://kino-server-x1xi.onrender.com";

function renderVideo(containerId, src) {
  const el = document.getElementById(containerId);
  if (!src) {
    el.innerHTML = `<div class="no-video"><span>🎬</span>Tez orada qo'shiladi</div>`;
    return;
  }
  // YouTube link
  if (src.includes('youtube.com') || src.includes('youtu.be')) {
    const videoId = src.includes('youtu.be') 
      ? src.split('youtu.be/')[1].split('?')[0]
      : src.split('v=')[1]?.split('&')[0];
    el.innerHTML = `<div class="video-container">
      <iframe src="https://www.youtube.com/embed/${videoId}?rel=0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    </div>`;
  } else if (src.startsWith('http')) {
    el.innerHTML = `<div class="video-container">
      <video controls controlsList="nodownload" oncontextmenu="return false" playsinline>
        <source src="${src}" type="video/mp4">
      </video>
    </div>`;
  } else if (src.length > 20) {
    // Telegram file_id - server orqali ijro
    el.innerHTML = `<div class="video-container">
      <video controls controlsList="nodownload" oncontextmenu="return false" playsinline
             onerror="this.parentElement.innerHTML='<div class=\'no-video\'><span>⏳</span>Server yuklanmoqda... (30 sek kuting)</div>'">
        <source src="${VIDEO_SERVER}/video/${src}" type="video/mp4">
      </video>
    </div>`;
  } else {
    el.innerHTML = `<div class="no-video"><span>🎬</span>Tez orada qo'shiladi</div>`;
  }
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'trailer') || (i === 1 && tab === 'full'));
  });
  document.getElementById('tab-trailer').classList.toggle('active', tab === 'trailer');
  document.getElementById('tab-full').classList.toggle('active', tab === 'full');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay')) {
    document.getElementById('modalOverlay').classList.remove('open');
  }
}

// Qidiruv
document.getElementById('searchInput').addEventListener('input', renderMovies);

// Ishga tushirish
renderGenres();
loadMovies();

// Logo animatsiyasi
function animateLogo() {
  const letters = document.querySelectorAll('.logo-letter');
  // Reset
  letters.forEach(l => {
    l.classList.remove('drop', 'spread');
    l.style.opacity = '0';
    l.style.transform = 'translateY(-40px) scale(0.5)';
  });

  // Har bir harf birin-ketin tushadi
  letters.forEach((l, i) => {
    setTimeout(() => {
      l.style.opacity = '1';
      l.style.transform = 'translateY(0) scale(1)';
      l.classList.add('drop');
    }, i * 120);
  });

  // Oxirida yoyiladi
  setTimeout(() => {
    letters.forEach(l => l.classList.add('spread'));
    setTimeout(() => {
      letters.forEach(l => l.classList.remove('spread'));
    }, 1000);
  }, letters.length * 120 + 300);
}

// Boshlash va har 8 soniyada takrorlash
animateLogo();
setInterval(animateLogo, 8000);
</script>
</body>
</html>
